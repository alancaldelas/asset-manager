apiVersion: v1
kind: Service
metadata:
  name: asset-manager
  namespace: infraops
  labels:
    app: asset-manager
    app.kubernetes.io/part-of: asset-manager
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: asset-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asset-manager
  namespace: infraops
  labels:
    app: asset-manager
    app.kubernetes.io/part-of: asset-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: asset-manager
  template:
    metadata:
      labels:
        app: asset-manager
        app.kubernetes.io/part-of: asset-manager
    spec:
      containers:
        - name: webui
          image: occ-quay.apps.sno.oset.amd.com/alan/asset-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: database-name
            # The app reads DATABASE_URL; build it from the secret values.
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)?sslmode=disable"
          readinessProbe:
            httpGet:
              path: /api/servers
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/servers
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
