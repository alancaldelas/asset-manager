apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: infraops
  labels:
    app.kubernetes.io/part-of: asset-manager
type: Opaque
stringData:
  # IMPORTANT: change these values before deploying to anything real.
  # Consider sealed-secrets / external-secrets instead of committing this file.
  database-user: "infra_admin"
  database-password: "ChangeMe-SuperSecureDbPassword"
  database-name: "asset_manager"
  # Secret used to sign session JWTs. Generate a strong random value, e.g.:
  #   openssl rand -base64 32
  session-secret: "ChangeMe-GenerateA32ByteRandomSecret"
  # Initial password for the auto-seeded "admin" account (first boot only).
  admin-default-password: "ChangeMe-AdminPassword"
