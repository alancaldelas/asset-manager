apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: asset-manager
  namespace: infraops
  labels:
    app: asset-manager
    app.kubernetes.io/part-of: asset-manager
spec:
  # Omit `host` to let OpenShift generate one from the cluster's default
  # apps domain, or set it explicitly, e.g.
  #   host: asset-manager.apps.my-cluster.example.com
  to:
    kind: Service
    name: asset-manager
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
