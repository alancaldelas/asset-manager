{{- include "asset-manager.validateDatabase" . -}}
{{/*
Chart-managed Secret. Holds the session signing key and the seeded admin
password (always), plus the database password when OpenShift mode manages the
in-chart PostgreSQL. Values are auto-generated when not supplied and preserved
across upgrades by looking up the existing Secret.
*/}}
{{- $secretName := include "asset-manager.secretName" . -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = $existing.data -}}
{{- end -}}

{{- $sessionSecret := .Values.app.sessionSecret -}}
{{- if not $sessionSecret -}}
{{- if hasKey $existingData "session-secret" -}}
{{- $sessionSecret = index $existingData "session-secret" | b64dec -}}
{{- else -}}
{{- $sessionSecret = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}

{{- $adminPassword := .Values.app.adminDefaultPassword -}}
{{- if not $adminPassword -}}
{{- if hasKey $existingData "admin-default-password" -}}
{{- $adminPassword = index $existingData "admin-default-password" | b64dec -}}
{{- else -}}
{{- $adminPassword = randAlphaNum 24 -}}
{{- end -}}
{{- end -}}

{{- $dbPassword := "" -}}
{{- if hasKey $existingData "password" -}}
{{- $dbPassword = index $existingData "password" | b64dec -}}
{{- else -}}
{{- $dbPassword = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "asset-manager.labels" . | nindent 4 }}
type: Opaque
data:
  session-secret: {{ $sessionSecret | b64enc | quote }}
  admin-default-password: {{ $adminPassword | b64enc | quote }}
  {{- if .Values.openshift.enabled }}
  # Used by the in-chart SCLorg PostgreSQL and the app's DATABASE_URL.
  password: {{ $dbPassword | b64enc | quote }}
  {{- end }}
