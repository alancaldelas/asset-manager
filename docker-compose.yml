version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: asset-manager-db
    restart: always
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: superSecretLocalPassword123
      POSTGRES_DB: server_assets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_admin -d server_assets"]
      interval: 5s
      timeout: 5s
      retries: 5

  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asset-manager-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres_admin:superSecretLocalPassword123@postgres-db:5432/server_assets?sslmode=disable
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
